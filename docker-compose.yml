version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: shop-mongo-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: shop-backend-app
    restart: always
    ports:
      - "8008:8000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shop-frontend-app
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data: